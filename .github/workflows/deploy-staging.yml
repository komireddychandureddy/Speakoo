name: Deploy to Staging

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/speakoo-api

jobs:
  build-and-deploy:
    name: Build, Push & Deploy (Staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:staging
            docker stop speakoo-api-staging || true
            docker rm speakoo-api-staging || true
            docker run -d \
              --name speakoo-api-staging \
              --restart unless-stopped \
              --network speakoo-net \
              -p 3000:3000 \
              --env-file /opt/speakoo/staging/.env \
              ${{ env.IMAGE_NAME }}:staging
            docker image prune -f
