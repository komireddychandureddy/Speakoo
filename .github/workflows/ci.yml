name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend (NestJS) ────────────────────────────────────────────
  api-lint-test:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: speakoo
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: speakoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://speakoo:testpassword@localhost:5432/speakoo_test

      - name: Run DB migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://speakoo:testpassword@localhost:5432/speakoo_test

      - name: Run unit tests
        run: npm run test:cov
        env:
          DATABASE_URL: postgresql://speakoo:testpassword@localhost:5432/speakoo_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: devsecret
          LIVEKIT_WS_URL: ws://localhost:7880
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: re_placeholder
          TWILIO_ACCOUNT_SID: ACplaceholder
          TWILIO_AUTH_TOKEN: placeholder
          TWILIO_WHATSAPP_FROM: whatsapp:+14155238886
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          PLATFORM_FEE_PERCENT: '5'
          NODE_ENV: test

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: apps/api/coverage
          flags: backend

  # ─── Flutter (Mobile + Web) ──────────────────────────────────────
  flutter-lint-test:
    name: Flutter — Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (must pass with zero warnings)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: apps/mobile/coverage
          flags: flutter

  # ─── Docker Build Check ──────────────────────────────────────────
  docker-build:
    name: Docker — Build Check
    runs-on: ubuntu-latest
    needs: [api-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t speakoo-api:ci ./apps/api

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: speakoo-api:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
