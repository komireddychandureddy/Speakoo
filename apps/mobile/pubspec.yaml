name: speakoo
description: Speakoo — Global multi-language tutoring platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  url_launcher: ^6.3.0
  firebase_messaging: ^15.1.0
  webview_flutter: ^4.9.0

  # Auth / Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Video session
  livekit_client: ^2.1.4

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Whiteboard
  perfect_freehand: ^2.0.1

  # Error tracking
  sentry_flutter: ^7.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
