<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56C25D"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- Tail feathers (behind body) -->
  <path d="M 78 158 Q 62 188 80 182 Q 90 174 96 184 Q 108 196 106 162 Z" fill="#1565C0"/>
  <path d="M 86 156 Q 74 182 88 176 Q 96 170 100 178 Q 108 188 108 158 Z" fill="#42A5F5"/>

  <!-- Parrot body -->
  <ellipse cx="92" cy="120" rx="36" ry="44" fill="url(#bodyGrad)"/>

  <!-- Wing detail -->
  <path d="M 60 98 Q 42 120 46 152 Q 62 160 78 134 Z" fill="url(#wingGrad)"/>
  <path d="M 64 104 Q 50 124 54 150 Q 68 156 82 132 Z" fill="#388E3C"/>

  <!-- Parrot head -->
  <circle cx="108" cy="72" r="34" fill="url(#bodyGrad)"/>

  <!-- Yellow forehead stripe -->
  <path d="M 84 50 Q 100 40 122 48 Q 114 56 96 56 Z" fill="#FDD835"/>

  <!-- Light green face -->
  <ellipse cx="118" cy="76" rx="19" ry="21" fill="#A5D6A7"/>

  <!-- Eye white -->
  <circle cx="120" cy="64" r="10" fill="white"/>
  <!-- Iris -->
  <circle cx="121" cy="64" r="7" fill="#1A237E"/>
  <!-- Pupil -->
  <circle cx="122" cy="63" r="3.5" fill="#0D0D0D"/>
  <!-- Eye highlight -->
  <circle cx="123" cy="61" r="2" fill="white"/>

  <!-- Upper beak -->
  <path d="M 130 78 Q 156 66 152 82 Q 148 92 130 90 Z" fill="#FB8C00"/>
  <!-- Lower beak (open - talking!) -->
  <path d="M 130 90 Q 148 90 144 102 Q 137 108 130 98 Z" fill="#FF6D00"/>

  <!-- Red cheek patch -->
  <ellipse cx="128" cy="85" rx="9" ry="5.5" fill="#EF5350" opacity="0.75"/>

  <!-- Speech bubble -->
  <rect x="144" y="46" width="48" height="32" rx="10" fill="white" opacity="0.95"/>
  <path d="M 150 78 L 144 88 L 158 78 Z" fill="white" opacity="0.95"/>
  <!-- Speech dots -->
  <circle cx="155" cy="62" r="4.5" fill="#43A047"/>
  <circle cx="168" cy="62" r="4.5" fill="#43A047"/>
  <circle cx="181" cy="62" r="4.5" fill="#43A047"/>

  <!-- Feet / perch -->
  <rect x="48" y="160" width="72" height="6" rx="3" fill="#5D4037"/>
  <path d="M 80 166 L 74 178 L 78 178 L 80 166 Z" fill="#5D4037"/>
  <path d="M 96 166 L 90 178 L 94 178 L 96 166 Z" fill="#5D4037"/>
  <path d="M 112 166 L 106 178 L 110 178 L 112 166 Z" fill="#5D4037"/>
</svg>
