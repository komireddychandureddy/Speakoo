# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Assumptions:
#   - The API image is pre-built and pushed to GHCR: ghcr.io/${GHCR_OWNER}/speakoo-api:${IMAGE_TAG}
#   - LiveKit Cloud is used in production (no self-hosted LiveKit container)
#   - An Nginx reverse proxy (or cloud load balancer) terminates TLS externally
#   - POSTGRES_DB set to speakoo_prod to avoid touching the dev database



services:
  postgres:
    environment:
      POSTGRES_DB: speakoo_prod
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    # Bind to all interfaces — restrict access via Oracle Cloud security groups / iptables
    ports:
      - '9000:9000'

  # Override the local build with the pre-built GHCR image
  api:
    image: ghcr.io/${GHCR_OWNER}/speakoo-api:${IMAGE_TAG}
    restart: unless-stopped
    # Compatibility fallback: some builds emit dist/main, others dist/src/main.
    command:
      - /bin/sh
      - -c
      - >-
        if [ -f dist/main.js ] || [ -f dist/main ]; then
          exec node dist/main;
        else
          exec node dist/src/main;
        fi
    environment:
      NODE_ENV: production
    # Bind to all interfaces — Oracle Cloud security groups restrict external access
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # No LiveKit container in prod — use LiveKit Cloud
  livekit:
    profiles:
      - dev_only  # never started unless explicitly requested

  prometheus:
    profiles:
      - monitoring
    ports:
      - '9090:9090'

  grafana:
    profiles:
      - monitoring
    ports:
      - '3001:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: speakoo-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /opt/speakoo/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/speakoo/apps/web/dist:/var/www/html:ro
    depends_on:
      - api
